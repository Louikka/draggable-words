<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!--[if IE]>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <![endif]-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="color-scheme" content="light" />

    <meta name="description" content="" />
    <meta name="keywords" content="" />

    <title>Draggable Words</title>


    <link rel="stylesheet" href="./public/bundle.css" />

    <script src="./public/bundle.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" />

    <style>
        [x-cloak] { display : none !important }
    </style>
</head>



<body x-data>
    <header>
        <div class="wrapper">
            <nav>
                <menu>
                    <li class="to_canvas"> <a class="button-preset violet round-except-bottom-right" href="#canvas">To canvas</a> </li>
                    <li class="repo"> <a class="button-preset violet round-except-top-right" href="https://github.com/Louikka/draggable-words" target="_blank">GitHub repository</a> </li>
                </menu>
            </nav>
        </div>
    </header>

    <main>
        <div class="wrapper">
            <section class="title" style="margin-top:8rem">
                <h1>
                    <span style="margin-left:1rem">Drag the words.</span><br />
                    <span style="margin-left:2.5rem">Split the words.</span>
                </h1>
                <p style="margin-left:4rem">
                    Lorem ipsum dolor sit amet, consectetur adipiscing elit,<br />
                    sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
                </p>
            </section>

            <section class="options" style="margin-top:8rem">
                <form name="main_input">
                    <section>
                        <p>Enter words here. Use spaces to separate them.</p>
                        <div>
                            <input
                                class="button-preset blue round-except-bottom-right"
                                name="input_text"
                                type="text"
                                placeholder="Enter word..."
                            />
                            <input
                                class="button-preset violet round-except-top-left"
                                name="input_button"
                                type="submit"
                            />
                        </div>
                    </section>

                    <hr />

                    <section class="main_input_form-options">
                        <p>
                            <label>
                                Auto split words
                                <input
                                    name="option_is_split"
                                    type="checkbox"
                                    x-init="$el.checked = $store.inputOptions.is_split"
                                    @change="$store.inputOptions.is_split = $el.checked"
                                />
                            </label>
                        </p>
                        <p x-cloak x-show="$store.inputOptions.is_split">
                            <label>
                                Use language
                                <select
                                    class="input-inline violet"
                                    name="option_language"
                                    x-init="$el.value = $store.inputOptions.language"
                                    @change="$store.inputOptions.language = $el.value"
                                >
                                    <option value="none">None</option>
                                    <option value="en">English</option>
                                    <option value="es">Spanish</option>
                                </select>
                            </label>
                        </p>
                        <p x-cloak x-show="$store.inputOptions.is_split && $store.inputOptions.language === 'none'">
                            <label>
                                Split by
                                <input
                                    class="input-inline blue"
                                    name="option_split_by_no_of_chars"
                                    type="number"
                                    min="1"
                                    style="width:3em"
                                    x-init="$el.value = $store.inputOptions.split_by_no_of_chars"
                                    @change="$store.inputOptions.split_by_no_of_chars = $el.value"
                                />
                                character(s)
                            </label>
                        </p>
                    </section>

                    <hr />

                    <section>
                        <input
                            class="button-preset blue round-except-bottom-right"
                            type="button"
                            value="Clear canvas"
                            onclick="clearCanvas()"
                        />
                    </section>
                </form>
            </section>
        </div>
    </main>

    <div id="canvas" style="margin:1rem 0"></div>

    <footer>
        <section style="margin-left:2rem">
            <a href="https://github.com/Louikka/draggable-words" target="_blank">GitHub</a>
        </section>
        <section style="margin-left:2rem">
            <small>&copy; Copyright 2025</small>
        </section>
    </footer>
</body>

</html>
